[workspace]
members = [
    "crates/hook-dll",
    "crates/conversion-service",
    "crates/common",
    "crates/dict-builder",
    "crates/cli",
]

resolver = "2"

[workspace.package]
# 全 crate の版の正本（各 crate は version.workspace = true で参照）。
# 上げ方は docs/release-and-versioning.md を参照。リリースタグ vX.Y.Z と一致させる
version = "1.0.0"
edition = "2021"