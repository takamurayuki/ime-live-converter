[package]
name = "hook-dll"
version = "0.1.0"
edition = "2021"

[dependencies]
windows = { version = "0.58", features = [
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Input_Ime",
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_System_Memory",
    "Win32_System_LibraryLoader",
    "Win32_Graphics_Gdi",
    "Win32_UI_Accessibility",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Console",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_Shell_Common",
    "Win32_System_SystemInformation",
    "Win32_Security",
] }

common = { path = "../common" }
zeroize = "1.7"
tracing = "0.1"

[dev-dependencies]
serial_test = "3"

[lib]
crate-type = ["cdylib"]

[features]
# フックスレッド分離の効果を証明するA/B実験専用。有効時のみWM_PAINTに
# 人工的な遅延を注入する（crates/hook-dll/src/popup.rs）。通常ビルドには
# 物理的に含まれないため、revert忘れが事故にならない。
ab_proof = []